{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold text-brand-900">
  {{ 'Edit student' if student else 'Add a student' }}
</h1>

<form method="post" class="mt-4 bg-white rounded-lg shadow-sm p-5 space-y-5">
  {% if error %}<p class="text-sm text-red-700 bg-red-50 rounded px-3 py-2">{{ error }}</p>{% endif %}

  <div class="grid sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium">Admission number *</label>
      <input name="admission_number" required class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium">Full name *</label>
      <input name="full_name" required class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium">Class</label>
      <select name="section_id" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
        <option value="">Not assigned</option>
        {% for s in sections %}<option value="{{ s.id }}">{{ s.label }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium">Roll number</label>
      <input name="roll_number" type="number" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium">Date of birth</label>
      <input name="date_of_birth" type="date" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium">Gender</label>
      <select name="gender" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
        <option value="">-</option><option>Female</option><option>Male</option><option>Other</option>
      </select>
    </div>
  </div>

  <fieldset class="border-t border-slate-200 pt-4">
    <legend class="text-sm font-medium">Guardian details</legend>
    <div class="grid sm:grid-cols-2 gap-4 mt-2">
      <div>
        <label class="block text-sm">Father's name</label>
        <input name="father_name" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm">Mother's name</label>
        <input name="mother_name" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm">Phone (for absence alerts)</label>
        <input name="guardian_phone" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm">Alternate phone</label>
        <input name="guardian_phone_alt" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm">Email</label>
        <input name="guardian_email" type="email" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm">Address</label>
        <textarea name="address" rows="2" class="mt-1 w-full border border-slate-300 rounded px-3 py-2"></textarea>
      </div>
    </div>
  </fieldset>

  <fieldset class="border-t border-slate-200 pt-4">
    <legend class="text-sm font-medium">Safety information</legend>
    <p class="text-xs text-slate-500 mt-1">
      Only what staff need in an emergency. Detailed medical history is deliberately not collected.
    </p>
    <div class="grid sm:grid-cols-2 gap-4 mt-2">
      <div>
        <label class="block text-sm">Blood group</label>
        <input name="blood_group" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm">Emergency contact</label>
        <input name="emergency_contact" class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm">Allergies / medical notes</label>
        <textarea name="allergies_or_medical" rows="2"
                  class="mt-1 w-full border border-slate-300 rounded px-3 py-2"></textarea>
      </div>
    </div>
  </fieldset>

  <div class="flex gap-2">
    <button class="px-5 py-2.5 bg-brand-800 text-white rounded font-medium">Save student</button>
    <a href="/students" class="px-5 py-2.5 border border-slate-300 rounded">Cancel</a>
  </div>
</form>
{% endblock %}
