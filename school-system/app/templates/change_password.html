{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-lg font-semibold">Change your password</h1>
  {% if user.must_change_password %}
    <p class="mt-2 text-sm bg-amber-50 text-amber-800 rounded px-3 py-2">
      Please choose your own password before continuing.
    </p>
  {% endif %}
  <form method="post" class="mt-4 space-y-4">
    <div>
      <label class="block text-sm font-medium">Current password</label>
      <input name="current_password" type="password" required
             class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium">New password</label>
      <input name="new_password" type="password" required minlength="8"
             class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
      <p class="text-xs text-slate-500 mt-1">At least 8 characters.</p>
    </div>
    <div>
      <label class="block text-sm font-medium">Confirm new password</label>
      <input name="confirm_password" type="password" required
             class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
    </div>
    {% if error %}<p class="text-sm text-red-700 bg-red-50 rounded px-3 py-2">{{ error }}</p>{% endif %}
    <button class="w-full bg-brand-800 text-white rounded py-2.5 font-medium">Save password</button>
  </form>
</div>
{% endblock %}
